[project]
name = "tinyscribe"
version = "0.1.0"
description = "Read Indian forms into JSON with a fine-tuned, quantized Qwen3.5 VLM that runs offline on a laptop."
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "Apache-2.0" }
dependencies = [
    "pillow>=11.3",
    "jsonschema>=4.23",
    "requests>=2.32",
    "typer>=0.12",
]

[project.optional-dependencies]
datagen = [
    "pymupdf>=1.27",
    "numpy>=2.0",
    "pyyaml>=6.0",
    "pyarrow>=17",
]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[project.scripts]
tinyscribe = "tinyscribe.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tinyscribe"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "datagen"]

[tool.ruff]
line-length = 110
extend-exclude = ["datagen/generate"]
